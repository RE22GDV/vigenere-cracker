[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vigenere-cracker"
version = "1.0.0"
description = "Vigenere cipher cracker for English, Russian and Ukrainian, with GPU brute force and frequency analysis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["vigenere", "cryptanalysis", "cipher", "frequency-analysis", "cuda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Natural Language :: Ukrainian",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
gpu = ["torch>=1.13"]
charts = ["matplotlib>=3.5"]
dev = ["matplotlib>=3.5"]

[project.scripts]
vigenere = "vigenere.cli:main"
vigenere-download = "vigenere.download_data:main"

[project.gui-scripts]
vigenere-gui = "vigenere.gui:main"

[tool.setuptools]
packages = ["vigenere"]
